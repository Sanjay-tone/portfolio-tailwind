  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="icon" href="/images/icons8-portfolio-64.png">

  <style>
    li {
      list-style: none;
      padding: 5px;
    }

    .bar {
      /*style the bar*/
      background-color: #353b48;
      display: block;
      height: 5px;
      border: 1px solid rgba(0, 0, 0, 0.3);
      border-radius: 3px;
      overflow: hidden;
      box-shadow: 0 0 10px #2187e7b3;
    }

    .bar span {
      /*style the span tag*/
      height: 4px;
      float: left;
      background-color: #2187e7;
    }

    .html {
      width: 100%;
      animation: html 4s;
    }

    .css {
      width: 100%;
      animation: css 4s;
    }

    .tailwind {
      width: 80%;
      animation: tailwind 4s;
    }

    .javascript {
      width: 90%;
      animation: javascript 4s;
    }

    .react {
      width: 80%;
      animation: react 4s;
    }

    .node {
      width: 70%;
      animation: node 4s;
    }

    .mango {
      width: 80%;
      animation: mango 4s;
    }

    @keyframes html {

      0% {
        width: 0%;
      }

      100% {
        width: 100%;
      }
    }

    @keyframes css {

      0% {
        width: 0%;
      }

      100% {
        width: 100%;
      }
    }

    @keyframes tailwind {

      0% {
        width: 0%;
      }

      100% {
        width: 80%;
      }
    }

    @keyframes javascript {

      0% {
        width: 0%;
      }

      100% {
        width: 90%;
      }
    }


    @keyframes react {

      0% {
        width: 0%;
      }

      100% {
        width: 70%;
      }
    }


    @keyframes node {

      0% {
        width: 0%;
      }

      100% {
        width: 70%;
      }
    }


    @keyframes mango {

      0% {
        width: 0%;
      }

      100% {
        width: 80%;
      }
    }

    #download-btn{
         color: white;
         border: 1px solid black;
         padding: 5px;
         background-color: red;
         border-radius: 10px;

    }

    #download-btn:hover{
      background-color: black;
    }
  </style>
</head>
