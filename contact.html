<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="icon" href="/images/icons8-portfolio-64.png">
  <style>
    .btn {
       padding: 5px;
      border-radius: 10px;

    }


    #submit{
      background-color: red;
      border-radius: 10px;

    }

    #submit:hover{
      background-color: royalblue;
    }

    div{
      border-radius: 15px;
    }
  </style>
</head>

<body style="background-color: #1D0845;">

  <!-- nav bar -->
  <nav class="bg-purple-800 p-4 flex items-center justify-between shadow-x2 sticky top-0">
    <h1 class="text-white text-2xl font-semibold">Portfolio</h1>

    <svg id="menuicon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
      stroke="currentColor" class="w-6 h-6 md:hidden text-white ">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
    </svg>

    <ul class="flex gap-5 text-white hidden md:flex font-semibold">
      <li>
        <a class=" hover:text-black" href="./index.html">HOME</a>
      </li>

      <li>
        <a class=" hover:text-black" href="./skill.html">SKILLS</a>
      </li>

      <li>
        <a class=" hover:text-black" href="./contact.html">CONTACT</a>
      </li>
    </ul>
  </nav>

  <!--side nav-->


  <section id="sidenav" class="bg-purple-700 fixed z-20 top-0 right-0 transition-all duration-700"
    style="width: 50%; height: 100vh; right:-50%;">
    <div class="text-right p-5">
      <p id="closenav" class="inline cursor-pointer">X</p>

    </div>

    <ul class="flex flex-col p-5 gap-5 text-white   md:flex font-semibold">
      <li>
        <a class=" hover:text-black" href="./index.html">HOME</a>
      </li>

      <li>
        <a class=" hover:text-black" href="./skill.html">SKILLS</a>
      </li>

      <li>
        <a class=" hover:text-black" href="./contact.html">CONTACT</a>
      </li>
    </ul>
  </section>


  <!--contact form-->

  

  <section class=" text-center m-10">

    <h1 class="text-white text-2xl font-semibold">GET IN <span class="text-pink-600">TOUCH</span></h1>

    <p class="text-yellow-500 p-5 text-2xl">"Have a project in mind? Let’s make it happen together."</p>

    <div>
      <img src="/images/undraw_personal-text_090t.svg" alt="" class="w-80 p-10 ">
    </div>
       
    
     
  

    <div class="p-5 bg-black inline-block">
    
      <form action="">
        <p>
          <label for="Name" class="text-yellow-400 p-3 m-4">Name:</label>
          <input type="text" placeholder="Name" id="name" class="btn" required>
        </p>
        <br>
        <p>
          <label for="email" class="text-yellow-400 p-3 m-4 ">EMAIL:</label>
          <input type="email" placeholder="Email" id="email" class="btn">
        </p>
        <br>
        <p>
          <label for="number" class="text-yellow-400 p-3 m-4 ">PHONE:</label>
          <input type="number" placeholder="TYPE YOUR NUMBER" id="number" class="btn">
        </p>
       <p>
        <button type="submit" id="submit" class="text-yellow-400 p-3 m-4">submit</button>
       </p>
        



      </form>
    </div>


  </section>

  <script src="./contact.js"></script>
</body>

</html>
